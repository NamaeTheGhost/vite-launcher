<!DOCTYPE html>
<html class="dark" lang="tr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vite Installer - Prototype</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-fixed-variant": "#26500a",
                      "surface-dim": "#131315",
                      "secondary-fixed": "#e4e2e4",
                      "inverse-on-surface": "#303032",
                      "outline": "#8c9384",
                      "inverse-surface": "#e4e2e4",
                      "tertiary-fixed": "#ffd8eb",
                      "surface-container-highest": "#353437",
                      "on-secondary": "#303032",
                      "on-primary-fixed": "#092100",
                      "surface-container-low": "#1b1b1d",
                      "outline-variant": "#42493c",
                      "on-secondary-container": "#b6b4b7",
                      "on-tertiary-fixed": "#3b002c",
                      "on-secondary-fixed-variant": "#474649",
                      "tertiary": "#ffc1e3",
                      "on-surface-variant": "#c2c9b8",
                      "on-surface": "#e4e2e4",
                      "on-tertiary-fixed-variant": "#732c5b",
                      "primary": "#aee18b",
                      "secondary-container": "#474649",
                      "primary-fixed": "#bdf199",
                      "secondary": "#c8c6c8",
                      "on-background": "#e4e2e4",
                      "on-primary": "#153800",
                      "error-container": "#93000a",
                      "primary-container": "#93c572",
                      "surface-tint": "#a2d580",
                      "background": "#131315",
                      "on-tertiary": "#581543",
                      "on-tertiary-container": "#752e5c",
                      "on-error": "#690005",
                      "error": "#ffb4ab",
                      "surface-container": "#1f1f21",
                      "surface-container-high": "#2a2a2c",
                      "surface-bright": "#39393b",
                      "tertiary-fixed-dim": "#ffaedc",
                      "surface-variant": "#353437",
                      "on-error-container": "#ffdad6",
                      "secondary-fixed-dim": "#c8c6c8",
                      "surface": "#131315",
                      "tertiary-container": "#f59bd0",
                      "inverse-primary": "#3d6922",
                      "on-secondary-fixed": "#1b1b1d",
                      "on-primary-container": "#27520b",
                      "surface-container-lowest": "#0e0e10",
                      "primary-fixed-dim": "#a2d580"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-sm": "8px",
                      "margin-main": "40px",
                      "gutter-md": "24px",
                      "app-width": "800px",
                      "app-height": "540px",
                      "stack-md": "16px",
                      "stack-lg": "32px"
              },
              "fontFamily": {
                      "sans": ["Hanken Grotesk", "sans-serif"],
                      "headline-lg": ["Hanken Grotesk"],
                      "label-md": ["Hanken Grotesk"],
                      "body-sm": ["Hanken Grotesk"],
                      "body-lg": ["Hanken Grotesk"],
                      "button-text": ["Hanken Grotesk"],
                      "headline-md": ["Hanken Grotesk"]
              }
            },
          },
        }
      </script>
    <style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #0e0e10;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pistachio-glow {
            filter: drop-shadow(0 0 15px rgba(147, 197, 114, 0.2));
        }
        .installer-window {
            width: 800px;
            height: 540px;
            display: flex;
            background: #131315;
            border-radius: 1rem;
            overflow: hidden;
            position: relative;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #42493c; border-radius: 10px; }
        .animate-bolt { animation: boltPulse 3s infinite; }
        @keyframes boltPulse {
            0%, 100% { transform: scale(1); }
            5% { transform: scale(1.15); }
            10% { transform: scale(1); }
        }
    </style>
    <!-- Load required libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        // --- Shared Components ---

        const Layout = ({ children, activeStep, sidebarImg, sidebarTitle = "Vite Installer", sidebarSubtitle = "Minimalist Setup" }) => {
            const navigate = useNavigate();
            const steps = [
                { id: '/', label: 'Welcome', icon: 'start' },
                { id: '/details', label: 'Details', icon: 'description' },
                { id: '/features', label: 'Features', icon: 'featured_play_list' },
                { id: '/location', label: 'Location', icon: 'folder_open' }
            ];

            return (
                <div class="installer-window shadow-2xl relative">
                    {/* Sidebar */}
                    <aside className="w-[40%] h-full bg-surface-dim flex flex-col border-r border-outline-variant py-stack-lg relative overflow-hidden z-10">
                        {sidebarImg && (
                            <div className="absolute inset-0 opacity-20 pointer-events-none z-0">
                                <img src={sidebarImg} alt="Abstract Background" className="w-full h-full object-cover grayscale" />
                            </div>
                        )}
                        <div className="px-gutter-md relative z-10">
                            <div className="flex items-center gap-stack-sm mb-stack-md">
                                <span className="material-symbols-outlined text-primary text-[32px]">install_desktop</span>
                                <h1 className="font-headline-lg text-headline-lg font-bold text-primary">{sidebarTitle}</h1>
                            </div>
                            <p className="font-label-md text-label-md text-on-surface-variant opacity-60">{sidebarSubtitle}</p>
                        </div>

                        <nav className="mt-stack-lg flex flex-col w-full relative z-10">
                            {steps.map(step => (
                                <div 
                                    key={step.id}
                                    onClick={() => navigate(step.id)}
                                    className={`px-8 py-3 flex items-center gap-stack-md cursor-pointer transition-colors ${
                                        activeStep === step.id 
                                        ? 'text-primary font-bold border-r-4 border-primary bg-surface-container-highest/20' 
                                        : 'text-on-surface-variant opacity-60 hover:opacity-100 hover:bg-surface-container-highest'
                                    }`}
                                >
                                    <span className="material-symbols-outlined">{step.icon}</span>
                                    <span className="font-label-md text-label-md">{step.label}</span>
                                </div>
                            ))}
                        </nav>

                        {/* Optional Decorative Box (seen in Screen 3) */}
                        {activeStep === '/details' && (
                            <div className="mt-auto px-margin-main pb-margin-main relative z-10">
                                <div className="w-full aspect-square rounded-lg overflow-hidden border border-outline-variant">
                                    <img className="w-full h-full object-cover grayscale opacity-40 hover:grayscale-0 hover:opacity-100 transition-all duration-700" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8zdshEvNW88MB7zgVFkVGaIdy0Aa8rcJeIgkEvJlyhK96nEluczvVfjXU9oKwNO-Qehz2ArfRayGaSZiDkRDq8hIquJFeGit9cEQXBwQuwhNLFbg8VXVV-Ck_cMS_9mQymmqDaoqeg_xe6xeC990HCY-y4sbGa237UXlLPXQRDGsrRjkOZXJRyDNcbrOoA4HhbvgDfH8ir1LRYKpPLJUBcAXPNTkGVEtRZ4rb_YZD8D5g1NWBaSKUnWphq5-PQ_N6DN7sP6bq_weD" />
                                </div>
                            </div>
                        )}
                    </aside>

                    {/* Main Content */}
                    <main className="w-[60%] h-full flex flex-col bg-surface relative overflow-hidden">
                        <header className="flex justify-between items-center px-gutter-md py-4 w-full bg-transparent absolute top-0 left-0 right-0 z-20">
                            <span className="font-label-md text-label-md text-on-surface-variant">
                                {activeStep === '/' ? '' : `Step ${steps.findIndex(s => s.id === activeStep) + 1}/4`}
                            </span>
                            <div className="flex gap-stack-sm">
                                <span className="material-symbols-outlined cursor-pointer text-on-surface-variant hover:text-primary transition-colors">minimize</span>
                                <span className="material-symbols-outlined cursor-pointer text-on-surface-variant hover:text-primary transition-colors">close</span>
                            </div>
                        </header>
                        
                        <div className="flex-grow pt-16 pb-24 overflow-y-auto custom-scrollbar">
                            {children}
                        </div>
                    </main>

                    {/* Atmospheric Glow */}
                    <div className="fixed top-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px] pointer-events-none"></div>
                </div>
            );
        };

        const Footer = ({ onBack, onNext, backText = "Geri", nextText = "İleri", nextIcon = "arrow_forward", isPrimary = true }) => (
            <footer className="absolute bottom-0 right-0 w-[60%] flex justify-end gap-stack-md px-margin-main py-stack-md bg-surface-container border-t border-outline-variant z-20">
                <button 
                    onClick={onBack}
                    className="bg-secondary-container text-on-secondary-container rounded-full px-8 py-3 font-button-text text-button-text hover:opacity-90 active:scale-95 transition-all flex items-center gap-2"
                >
                    <span className="material-symbols-outlined text-[20px]">arrow_back</span>
                    {backText}
                </button>
                <button 
                    onClick={onNext}
                    className={`${isPrimary ? 'bg-primary text-on-primary' : 'bg-primary-container text-on-primary-container'} rounded-full px-8 py-3 font-bold font-button-text text-button-text hover:opacity-90 active:scale-95 transition-all flex items-center gap-2`}
                >
                    {nextText}
                    <span className="material-symbols-outlined text-[20px]">{nextIcon}</span>
                </button>
            </footer>
        );

        // --- Screen Components ---

        const WelcomeScreen = () => {
            const navigate = useNavigate();
            return (
                <div className="flex flex-col justify-center px-margin-main h-full">
                    <div className="mb-stack-lg flex items-center justify-center w-20 h-20 rounded-2xl bg-surface-container-high border border-outline-variant pistachio-glow">
                        <span className="material-symbols-outlined text-primary text-[48px] animate-bolt" style={{fontVariationSettings: "'FILL' 1"}}>bolt</span>
                    </div>
                    <h1 className="font-headline-lg text-headline-lg mb-stack-md text-on-surface">Vite Projenize Hoş Geldiniz</h1>
                    <p className="font-body-lg text-body-lg text-on-surface-variant leading-relaxed mb-stack-lg">
                        Modern ve hızlı bir geliştirme deneyimi için doğru yerdesiniz. Bu araç, projenizi saniyeler içinde yapılandırmanıza yardımcı olur.
                    </p>
                    <div className="flex flex-wrap gap-stack-sm mb-stack-lg">
                        {['Turbo Hız', 'HMR Desteği', 'Güvenli Kurulum'].map((feat, i) => (
                            <div key={i} className="flex items-center gap-2 bg-surface-container-highest px-3 py-1.5 rounded-full border border-outline-variant">
                                <span className="material-symbols-outlined text-primary text-sm">check_circle</span>
                                <span className="font-label-md text-label-md text-on-surface">{feat}</span>
                            </div>
                        ))}
                    </div>
                    <Footer 
                        onBack={() => {}} 
                        onNext={() => navigate('/details')} 
                        backText="Back" 
                        nextText="Start Setup" 
                    />
                </div>
            );
        };

        const DetailsScreen = () => {
            const navigate = useNavigate();
            const [projectName, setProjectName] = useState("");
            
            return (
                <div className="flex flex-col gap-stack-lg px-margin-main mt-8">
                    <div className="space-y-2">
                        <h1 className="font-headline-lg text-headline-lg text-on-surface">Proje Detayları</h1>
                        <p className="font-body-lg text-body-lg text-on-surface-variant">Lütfen oluşturmak istediğiniz yeni projenin temel bilgilerini girin.</p>
                    </div>

                    <div className="flex flex-col gap-stack-sm">
                        <label className="font-label-md text-label-md text-primary ml-2">Proje Adı</label>
                        <input 
                            type="text" 
                            value={projectName}
                            onChange={(e) => setProjectName(e.target.value)}
                            placeholder="örneğin: modern-ui-projesi"
                            className="w-full bg-surface-container-high border border-outline-variant rounded-full px-6 py-4 font-body-lg text-on-surface focus:border-primary outline-none transition-all"
                        />
                        <p className="font-body-sm text-body-sm text-on-surface-variant opacity-50 ml-4">Bu ad proje klasörü ve meta veriler için kullanılacaktır.</p>
                    </div>

                    <div className="flex flex-col gap-stack-sm mt-stack-md">
                        <label className="font-label-md text-label-md text-on-surface-variant ml-2">Şablon Seçimi</label>
                        <div className="bg-surface-container-low border border-primary rounded-lg p-4 flex justify-between items-center cursor-pointer">
                            <div className="flex items-center gap-3">
                                <span className="material-symbols-outlined text-primary">terminal</span>
                                <span className="font-body-lg text-body-lg">Standart TypeScript Uygulaması</span>
                            </div>
                            <div className="w-4 h-4 rounded-full border-2 border-primary bg-primary flex items-center justify-center">
                                <div className="w-1.5 h-1.5 bg-on-primary rounded-full"></div>
                            </div>
                        </div>
                    </div>
                    
                    <Footer onBack={() => navigate('/')} onNext={() => navigate('/features')} />
                </div>
            );
        };

        const FeaturesScreen = () => {
            const navigate = useNavigate();
            const [features, setFeatures] = useState([
                { id: 'ts', label: 'TypeScript', desc: 'Statik tipleme ile güvenli kod.', icon: 'terminal', checked: true },
                { id: 'tw', label: 'Tailwind CSS', desc: 'Utility-first styling.', icon: 'palette', checked: true },
                { id: 'lint', label: 'ESLint', desc: 'Statik analiz aracı.', icon: 'rule', checked: false },
                { id: 'pret', label: 'Prettier', desc: 'Kod formatlayıcı.', icon: 'format_align_left', checked: false }
            ]);

            const toggle = (id) => {
                setFeatures(features.map(f => f.id === id ? {...f, checked: !f.checked} : f));
            };

            return (
                <div className="px-margin-main flex flex-col mt-4">
                    <h2 className="font-headline-md text-headline-md text-on-surface mb-2">Özellikleri Seçin</h2>
                    <p className="font-body-lg text-body-lg text-on-surface-variant mb-6">Projenize dahil etmek istediğiniz modülleri seçin.</p>
                    <div className="space-y-2">
                        {features.map(f => (
                            <label 
                                key={f.id} 
                                onClick={() => toggle(f.id)}
                                className={`flex items-center justify-between p-4 rounded-full border transition-all cursor-pointer ${
                                    f.checked ? 'border-primary bg-surface-container-high' : 'border-outline-variant bg-surface-container-high hover:border-primary/50'
                                }`}
                            >
                                <div className="flex items-center gap-4">
                                    <div className="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
                                        <span className="material-symbols-outlined text-primary">{f.icon}</span>
                                    </div>
                                    <div>
                                        <div className="font-label-md text-label-md text-on-surface">{f.label}</div>
                                        <div className="text-[12px] text-on-surface-variant">{f.desc}</div>
                                    </div>
                                </div>
                                <div className={`w-6 h-6 rounded-full border-2 transition-all flex items-center justify-center ${
                                    f.checked ? 'border-primary bg-primary' : 'border-outline-variant'
                                }`}>
                                    {f.checked && <span className="material-symbols-outlined text-[16px] text-on-primary">check</span>}
                                </div>
                            </label>
                        ))}
                    </div>
                    <Footer onBack={() => navigate('/details')} onNext={() => navigate('/location')} />
                </div>
            );
        };

        const LocationScreen = () => {
            const navigate = useNavigate();
            const [installing, setInstalling] = useState(false);

            const handleInstall = () => {
                setInstalling(true);
                setTimeout(() => {
                    alert('Kurulum başarıyla tamamlandı!');
                    setInstalling(false);
                }, 2000);
            };

            return (
                <div className="px-margin-main mt-4">
                    <h2 className="font-headline-md text-headline-md text-on-surface mb-2">Kurulum Konumu</h2>
                    <p className="font-body-lg text-body-lg text-on-surface-variant mb-6">Lütfen yazılımın kurulacağı hedef dizini seçin.</p>
                    
                    <div className="bg-surface-container-low p-4 rounded-lg border border-outline-variant/10">
                        <label className="font-label-md text-label-md text-on-surface-variant block mb-2">Yükleme Yolu</label>
                        <div className="flex items-center gap-stack-sm">
                            <div className="flex-grow bg-surface-container-high rounded-full px-4 py-3 border border-transparent focus-within:border-primary transition-all flex items-center gap-2">
                                <span className="material-symbols-outlined text-on-surface-variant text-[20px]">folder</span>
                                <input className="bg-transparent border-none outline-none text-on-surface font-body-sm w-full p-0" readOnly type="text" value="C:\Program Files\ViteInstaller" />
                            </div>
                            <button className="bg-secondary-container text-on-secondary-container font-button-text px-4 py-3 rounded-full hover:opacity-90">Gözat</button>
                        </div>
                    </div>

                    <div className="mt-6 grid grid-cols-2 gap-4">
                        <div className="bg-surface-container-low p-4 rounded-lg border border-outline-variant/10">
                            <span className="font-label-md text-label-md text-on-surface-variant block mb-1">Gerekli Alan</span>
                            <span className="font-headline-md text-headline-md text-on-surface">1.24 GB</span>
                        </div>
                        <div className="bg-surface-container-low p-4 rounded-lg border border-outline-variant/10">
                            <span className="font-label-md text-label-md text-on-surface-variant block mb-1">Kullanılabilir Alan</span>
                            <span className="font-headline-md text-headline-md text-primary">42.8 GB</span>
                        </div>
                    </div>

                    <Footer 
                        onBack={() => navigate('/features')} 
                        onNext={handleInstall} 
                        nextText={installing ? "Hazırlanıyor..." : "Kurulumu Başlat"}
                        nextIcon={installing ? "refresh" : "arrow_forward"}
                        isPrimary={false}
                    />
                </div>
            );
        };

        // --- Main App Component ---

        const App = () => {
            const location = useLocation();
            
            // Map sidebars based on active path
            const sidebarImages = {
                '/': '',
                '/details': 'https://lh3.googleusercontent.com/aida-public/AB6AXuAd_pV46GkM78NkBdswnP2fZvZF86ANaaepyAr1h55RgSYf2PjylBifQEAKHcVhSuSM5lSQ0P4JNNzZV8fJgx_KrGSI2SLM3npx_QmhHahaT9Iata3sjiVac_1-9BVgUZTrM7MUg10IfVwvX0Pqv9fv_wjLhY6WWzgUF-QEJ154FkJ3TblOxKVDx4KmaBwnzoacbjrMGrX--zkCleaf1zzPRagbseM7-Odj4abQbK9e8KgZiEVEa58HIhapSTq_Uw83ePld3BJhc_XI',
                '/features': 'https://lh3.googleusercontent.com/aida-public/AB6AXuAt_bZi48jO43_CUwszj9Z0lU3T6FJxT9CpWkAmMGK_d8iWRkhPQKDJJLOmtQkKTXiXtg7kfJgGWD5Xcbec7pIyzXifINlp1lOPdricRlxySOy4cMWMkGMHzNvVRBRCkznY7S6GqNHv9bRptYsNxuVtG65RSzMsyWvskzZeyx4-ogr_HaLb2m1Z_32c1WkmZ6pwDnJqqgEMJ1M3cn-Ttl07oijpZzlG2wEggIMuwQDOcJwuJHKgG6csivEb_xEOCv5_wDTTHxDQN7Cc',
                '/location': 'https://lh3.googleusercontent.com/aida-public/AB6AXuAd_pV46GkM78NkBdswnP2fZvZF86ANaaepyAr1h55RgSYf2PjylBifQEAKHcVhSuSM5lSQ0P4JNNzZV8fJgx_KrGSI2SLM3npx_QmhHahaT9Iata3sjiVac_1-9BVgUZTrM7MUg10IfVwvX0Pqv9fv_wjLhY6WWzgUF-QEJ154FkJ3TblOxKVDx4KmaBwnzoacbjrMGrX--zkCleaf1zzPRagbseM7-Odj4abQbK9e8KgZiEVEa58HIhapSTq_Uw83ePld3BJhc_XI'
            };

            return (
                <Layout activeStep={location.pathname} sidebarImg={sidebarImages[location.pathname]}>
                    <Routes>
                        <Route path="/" element={<WelcomeScreen />} />
                        <Route path="/details" element={<DetailsScreen />} />
                        <Route path="/features" element={<FeaturesScreen />} />
                        <Route path="/location" element={<LocationScreen />} />
                    </Routes>
                </Layout>
            );
        };

        // --- Initialization ---

        const rootElement = document.getElementById('root');
        const root = createRoot(rootElement);
        root.render(
            <MemoryRouter>
                <App />
            </MemoryRouter>
        );
    </script>
</body>
</html>
